name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q MobDodger.zip
      - run: cd MobDodger && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MobDodger-apk
          path: MobDodger/app/build/outputs/apk/debug/*.apk
